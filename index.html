<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Ma Yar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6ea 0%, #ffc0cb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            border: 2px solid #ffccd5;
            text-align: center;
        }

        h2 {
            color: #ff3366;
            font-size: 22px;
            margin-bottom: 8px;
        }

        h3 {
            color: #ff6688;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .message-card {
            background: #fff0f3;
            border-radius: 15px;
            padding: 15px;
            height: 40vh;
            overflow-y: auto;
            border: 1px solid #ffb3c1;
            text-align: left;
            margin-bottom: 15px;
        }

        .line {
            color: #d90429;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 3px;
        }

        .btn-forgive {
            background: linear-gradient(45deg, #ff3366, #ff6688);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>မျက်မှန်လေးနဲ့ Ma Ma ရာ 🤌❤️</h2>
        <h3>ပြုံးနေမှလှတာ မမရ 🙈🤌 အပြုံးမပျက်လိုက်ပါနဲ့ 🙊</h3>
        
        <div class="message-card" id="scroll-box">
            <div id="output"></div>
        </div>

        <button class="btn-forgive" onclick="alert('အပြုံးလေးနဲ့ မမက ပိုလှတာမို့ စိတ်မကောက်ကြေးနော်! ❤️✨')">
            စိတ်မကောက်တော့ဘူးမလား? 🙈🤌
        </button>
    </div>

    <script>
        var outputBox = document.getElementById('output');
        var textContent = '';

        for (var i = 1; i <= 1000; i++) {
            textContent += '<div class="line">' + i + '. စိတ်မကောက်ရဝူးလေ နော်လို့ 🙈🤪</div>';
        }

        outputBox.innerHTML = textContent;
    </script>
</body>
</html>
